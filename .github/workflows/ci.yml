name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances (dev = runtime + lint/tests)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Tests (pytest) — inclut le smoke-import des 277 scrapers
        # Pas besoin d'installer les navigateurs Playwright : le smoke-test
        # importe seulement les modules (le réseau n'est touché que dans search()).
        run: pytest
